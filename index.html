<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="Aid Pulse: Hands-free, visual-first emergency assistant HUD for Meta Ray-Ban Display glasses.">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>AID PULSE</title>
  <link rel="icon" type="image/png" href="favicon.png">
  
  <!-- Waveguide Calm HUD Fonts: Inter & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <style>
    :root {
      --bg-black: #000000;
      --surface-container-lowest: #0C0E13;
      --surface-container-low: #1A1C21;
      --surface-container: #181A1F;
      --surface-container-high: #282A2F;
      --surface-container-highest: #33353A;
      
      --primary: #C3F5FF;
      --primary-container: #00E5FF;
      --on-primary-container: #001F24;
      
      --secondary: #4DFFB2;
      --secondary-solid: #10E599;
      
      --on-surface: #FFFFFF;
      --on-surface-variant: #8E95A5;
      --outline: #849396;
      --error: #FF453A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 600px;
      height: 600px;
      max-width: 600px;
      max-height: 600px;
      min-width: 600px;
      min-height: 600px;
      background: var(--bg-black);
      color: var(--on-surface);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    /* 600x600 Display Frame with 32px (2rem) Waveguide Safe Inset Margin */
    #hud-container {
      width: 600px;
      height: 600px;
      background: var(--bg-black);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 32px 28px 32px;
      outline: none;
    }

    /* Material Symbols Styling Helper */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    /* --- Top Anchored HUD Header --- */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 38px;
      width: 100%;
    }

    /* Breadcrumb Anchor Navigation Pill */
    .breadcrumb-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-container-low);
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.1s ease;
    }
    .breadcrumb-pill:hover, .breadcrumb-pill:active {
      background: var(--surface-container-high);
      border-color: var(--primary-container);
    }
    .breadcrumb-pill .arrow-icon {
      color: var(--primary-container);
      font-size: 16px;
      font-weight: 700;
    }
    .breadcrumb-pill .pill-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--on-surface);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Brand Anchor (Home) */
    .brand-anchor {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-container);
      box-shadow: 0 0 8px var(--primary-container);
    }
    .brand-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--primary);
      letter-spacing: -0.01em;
    }

    /* Optical Telemetry / Sensor Status Pill */
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-container-low);
      padding: 5px 12px;
      border-radius: 9999px;
    }
    .status-pill-icon {
      font-size: 16px;
      color: var(--primary-container);
    }
    .status-pill-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--on-surface);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .category-sensor-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 600;
      color: var(--on-surface);
      letter-spacing: -0.01em;
    }
    .category-sensor-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--secondary-solid);
      box-shadow: 0 0 8px var(--secondary-solid);
    }

    /* --- Main Viewport --- */
    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 420px;
      padding: 8px 0;
    }

    .eyebrow {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--on-surface-variant);
      font-weight: 700;
      margin-bottom: 12px;
      text-align: left;
      width: 100%;
      padding-left: 4px;
    }

    /* --- Stacked Focal Categories (Menu Cards) --- */
    .menu-options {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: auto 0;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 88px;
      padding: 0 20px;
      border-radius: 24px;
      background: var(--surface-container);
      border: 2px solid transparent;
      color: var(--on-surface);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .menu-item:active {
      transform: scale(0.99);
    }

    /* Focused Card State: Solid 2px #00E5FF Outline */
    .menu-item.selected {
      border-color: var(--primary-container);
      outline: none;
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Circular Leading Glyph */
    .menu-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface-container-high);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--on-surface);
    }
    .menu-icon-circle .material-symbols-outlined {
      font-size: 24px;
    }
    .menu-item.selected .menu-icon-circle {
      color: var(--primary-container);
    }

    .menu-text-stack {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 2px;
    }
    .menu-item-label {
      font-size: 22px;
      font-weight: 600;
      color: var(--on-surface);
      letter-spacing: -0.01em;
    }
    .menu-item.selected .menu-item-label {
      color: var(--primary);
    }

    .menu-item-sub {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
    }
    .menu-item.selected .menu-item-sub {
      color: var(--primary-container);
    }

    /* Right Action Pill / Arrow */
    .menu-item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .menu-action-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-container);
    }
    .menu-arrow-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-container-high);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--outline);
    }
    .menu-arrow-circle .material-symbols-outlined {
      font-size: 20px;
    }
    .menu-item.selected .menu-arrow-circle {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
    .menu-item.selected .menu-arrow-circle .material-symbols-outlined {
      font-weight: 700;
    }

    /* --- Stepped Detail Views (CPR, Choking, Fire, etc.) --- */
    .step-view {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: 4px 0;
    }

    .step-header {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
    }

    .step-title {
      font-size: 26px;
      font-weight: 600;
      margin: 4px 0 2px;
      color: var(--on-surface);
      letter-spacing: -0.01em;
    }

    .step-desc {
      font-size: 18px;
      color: #BAC9CC;
      line-height: 1.35;
      max-width: 500px;
    }

    .step-illustration-container {
      width: 250px;
      height: 145px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 4px 0;
      border-radius: 24px;
      background: var(--surface-container);
      border: 2px solid var(--surface-container-high);
    }

    .step-image {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      background: transparent;
    }

    /* Pacing Metronome (CPR) - 110 BPM */
    .cpr-pacer-ring {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--primary-container);
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: cprPulse 0.545s infinite ease-out;
    }
    .cpr-pacer-ring.overlay-badge {
      width: 44px;
      height: 44px;
      bottom: 8px;
      right: 8px;
      top: auto;
      left: auto;
      border-width: 3px;
      background: var(--surface-container);
    }
    .cpr-pacer-core {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary-container);
    }
    .cpr-pacer-core.overlay-badge-core {
      width: 16px;
      height: 16px;
    }

    @keyframes cprPulse {
      0% { transform: scale(0.85); opacity: 1; border-width: 4px; }
      50% { transform: scale(1.15); opacity: 0.7; }
      100% { transform: scale(0.85); opacity: 1; border-width: 4px; }
    }

    .bpm-tag {
      font-size: 14px;
      color: var(--primary-container);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Stepper Progress Bar & Dots */
    .stepper-progress-wrap {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .stepper-dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--surface-container-high);
    }
    .dot.active {
      background: var(--primary-container);
      box-shadow: 0 0 6px var(--primary-container);
    }

    .step-timer-bar {
      width: 100%;
      height: 4px;
      background: var(--surface-container-high);
      border-radius: 9999px;
      overflow: hidden;
    }
    .step-timer-fill {
      height: 100%;
      width: 0%;
      background: var(--primary-container);
      animation: autoAdvance 5s linear forwards;
    }

    @keyframes autoAdvance {
      from { width: 0%; }
      to { width: 100%; }
    }

    /* --- Calm Mode Breathing Interface --- */
    .calm-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 20px;
    }
    .calm-shape-wrap {
      width: 200px;
      height: 200px;
      display: grid;
      place-items: center;
      position: relative;
    }
    .calm-circle-outer {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 2px dashed rgba(77, 255, 178, 0.4);
      position: absolute;
    }
    .calm-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(77, 255, 178, 0.8) 0%, rgba(77, 255, 178, 0.2) 70%, transparent 100%);
      border: 3px solid var(--secondary);
      box-shadow: 0 0 30px rgba(77, 255, 178, 0.4);
      animation: breatheInOut 8s infinite ease-in-out;
    }

    @keyframes breatheInOut {
      0%, 100% {
        transform: scale(1);
        opacity: 0.5;
        border-color: rgba(77, 255, 178, 0.6);
      }
      50% {
        transform: scale(2.0);
        opacity: 1;
        border-color: var(--secondary);
        box-shadow: 0 0 45px rgba(77, 255, 178, 0.6);
      }
    }

    .calm-text {
      font-size: 28px;
      font-weight: 600;
      color: var(--secondary);
      letter-spacing: -0.01em;
      height: 40px;
      display: flex;
      align-items: center;
    }

    /* --- Confirmation / Alert Cards --- */
    .alert-box {
      border: 2px solid var(--primary-container);
      background: var(--surface-container);
      border-radius: 24px;
      padding: 24px 28px;
      text-align: center;
      max-width: 480px;
    }
    .alert-box.emergency {
      border-color: var(--error);
    }
    .alert-icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--surface-container-high);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px auto;
      color: var(--primary-container);
    }
    .alert-box.emergency .alert-icon-wrap {
      color: var(--error);
    }
    .alert-icon-wrap .material-symbols-outlined {
      font-size: 32px;
    }
    .alert-title {
      font-size: 26px;
      font-weight: 600;
      color: var(--on-surface);
      margin-bottom: 8px;
    }
    .alert-sub {
      font-size: 18px;
      color: #BAC9CC;
      line-height: 1.4;
    }

    /* --- Bottom Interaction Hint (Temple Touch Guide) --- */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
      width: 100%;
      padding: 0 4px;
    }
    .bottom-left-hint {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hint-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--outline);
    }
    .hint-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--outline);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .bottom-right-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-container-low);
      padding: 5px 12px;
      border-radius: 9999px;
    }
    .bottom-action-key {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-container);
    }
    .bottom-action-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--outline);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div id="hud-container" tabindex="0">
    <!-- Top Anchored HUD Header -->
    <header class="top-bar" id="top-bar">
      <!-- Dynamic header injected here -->
    </header>

    <!-- Main Viewport Area -->
    <main id="viewport" class="screen-content">
      <!-- Dynamic Screen Content Rendered Here -->
    </main>

    <!-- Bottom Interaction Hint / Temple Touch Guide -->
    <footer class="bottom-bar">
      <div class="bottom-left-hint">
        <span class="hint-dot"></span>
        <span class="hint-text">Swipe Temple To Scroll</span>
      </div>
      <div class="bottom-right-pill">
        <span class="bottom-action-key">TAP</span>
        <span class="bottom-action-label">Select</span>
      </div>
    </footer>
  </div>

  <script>
    // State Store
    const state = {
      currentScreen: 'HOME',
      history: [],
      selectedIndex: 0,
      currentStep: 0,
      calmInterval: null,
      calmPhase: 'in',
      stepTimer: null
    };

    // Flow Content Definitions
    const FLOWS = {
      HOME: {
        title: 'Aid Pulse',
        category: 'HOME',
        type: 'menu',
        eyebrow: 'Select Category',
        items: [
          { id: 'MEDICAL_MENU', label: 'Medical', sub: 'Triage • Vitals • CPR', icon: 'medical_services' },
          { id: 'SAFETY_MENU', label: 'Safety', sub: 'Hazard • SOS • Route', icon: 'shield' },
          { id: 'CALM', label: 'Calm', sub: 'Paced Breathing • Ground', icon: 'self_improvement' }
        ]
      },
      MEDICAL_MENU: {
        title: 'Medical',
        category: 'Medical',
        type: 'menu',
        eyebrow: 'Medical Emergency Protocol',
        items: [
          { id: 'CPR', label: 'CPR Guidance', sub: 'Paced compressions • 110 BPM', icon: 'favorite' },
          { id: 'CHOKING', label: 'Choking Relief', sub: 'Back blows • Abdominal thrusts', icon: 'air' },
          { id: 'DROWNING', label: 'Drowning Response', sub: 'Rescue breaths • Water recovery', icon: 'water' },
          { id: 'STROKE', label: 'Stroke (FAST)', sub: 'Face • Arms • Speech check', icon: 'neurology' }
        ]
      },
      SAFETY_MENU: {
        title: 'Safety',
        category: 'Safety',
        type: 'menu',
        eyebrow: 'Safety & Threat Response',
        items: [
          { id: 'FIRE_MENU', label: 'Fire Emergency', sub: 'Extinguisher P.A.S.S. • Evac', icon: 'local_fire_department' },
          { id: 'POLICE', label: 'Police Alert', sub: 'Silent SOS • Beacon active', icon: 'local_police' }
        ]
      },
      FIRE_MENU: {
        title: 'Fire Safety',
        category: 'Safety',
        type: 'menu',
        eyebrow: 'Fire Protocol',
        items: [
          { id: 'FIRE_EXTINGUISHER', label: 'Extinguisher (P.A.S.S.)', sub: 'Pull • Aim • Squeeze • Sweep', icon: 'fire_extinguisher' },
          { id: 'FIRE_CALL', label: 'Call Fire Dept', sub: 'Evacuate immediately • 911', icon: 'call' }
        ]
      },
      CPR: {
        title: 'CPR Guidance',
        category: 'Medical',
        type: 'stepper',
        hasPacer: true,
        steps: [
          {
            title: '1. Check Scene & Person',
            desc: 'Ensure area is safe. Tap shoulders firmly: "Are you OK?"',
            img: 'images/cpr-1.png'
          },
          {
            title: '2. Check Breathing',
            desc: 'Look for chest rise. If unresponsive or not breathing normally, act now.',
            img: 'images/cpr-2.png'
          },
          {
            title: '3. Call 911 / AED',
            desc: 'Direct someone to call 911 and get an AED immediately.',
            img: 'images/cpr-3.png'
          },
          {
            title: '4. Hand Placement',
            desc: 'Interlock hands in center of chest. Keep arms straight, shoulders over hands.',
            img: 'images/cpr-4.png'
          },
          {
            title: '5. Push Hard & Fast',
            desc: 'Push down 2 inches deep. Follow the 110 BPM pulsing rhythm below.',
            img: 'images/cpr-5.png',
            showPacer: true
          },
          {
            title: '6. Breaths & Repeat',
            desc: 'Give 2 breaths every 30 compressions. Repeat until help arrives.',
            img: 'images/cpr-6.png'
          }
        ]
      },
      CHOKING: {
        title: 'Choking Relief',
        category: 'Medical',
        type: 'stepper',
        steps: [
          {
            title: '1. Recognize & Ask',
            desc: 'Cannot speak or cough? Ask: "Are you choking?" Verify silent nod.',
            img: 'images/choking-1.png'
          },
          {
            title: '2. 5 Back Blows',
            desc: 'Lean victim forward. Deliver 5 firm blows between shoulder blades with palm heel.',
            img: 'images/choking-2.png'
          },
          {
            title: '3. 5 Abdominal Thrusts',
            desc: 'Fist above navel, other hand over fist. Quick upward and inward thrusts.',
            img: 'images/choking-3.png'
          },
          {
            title: '4. Alternate & Repeat',
            desc: 'Repeat 5 blows / 5 thrusts. If person becomes unresponsive, start CPR.',
            img: 'images/choking-4.png'
          }
        ]
      },
      DROWNING: {
        title: 'Drowning Response',
        category: 'Medical',
        type: 'stepper',
        steps: [
          {
            title: '1. Safe Retrieval',
            desc: 'Get person out of water safely without endangering yourself. Call for help.',
            img: 'images/drowning-1.png'
          },
          {
            title: '2. Check Responsiveness',
            desc: 'Lay on back on firm ground. Check for breathing and pulse for 10 seconds.',
            img: 'images/drowning-2.png'
          },
          {
            title: '3. 5 Initial Breaths',
            desc: 'Tilt head, lift chin. Give 5 initial rescue breaths to oxygenate lungs.',
            img: 'images/drowning-3.png'
          },
          {
            title: '4. 30 Compressions',
            desc: 'Begin cycles of 30 chest compressions followed by 2 rescue breaths.',
            img: 'images/drowning-4.png'
          }
        ]
      },
      STROKE: {
        title: 'Stroke (F.A.S.T.)',
        category: 'Medical',
        type: 'stepper',
        steps: [
          {
            title: '1. Face Drooping',
            desc: 'Ask person to smile. Does one side of the face droop or feel numb?',
            img: 'images/stroke-1.png'
          },
          {
            title: '2. Arm Weakness',
            desc: 'Ask person to raise both arms. Does one arm drift downward?',
            img: 'images/stroke-2.png'
          },
          {
            title: '3. Speech Difficulty',
            desc: 'Ask person to repeat a simple sentence. Is speech slurred or strange?',
            img: 'images/stroke-3.png'
          },
          {
            title: '4. Time to Call 911',
            desc: 'If any symptom is present, call 911 immediately. Note time symptoms began.',
            img: 'images/stroke-4.png'
          }
        ]
      },
      FIRE_EXTINGUISHER: {
        title: 'Extinguisher (P.A.S.S.)',
        category: 'Safety',
        type: 'stepper',
        steps: [
          {
            title: '1. Pull the Pin',
            desc: 'Pull the pin to break the tamper seal at top of extinguisher.',
            img: 'images/ext-1.png'
          },
          {
            title: '2. Aim at the Base',
            desc: 'Aim low, pointing the nozzle or hose at the base of the fire.',
            img: 'images/ext-2.png'
          },
          {
            title: '3. Squeeze the Handle',
            desc: 'Squeeze the lever slowly and evenly to release extinguishing agent.',
            img: 'images/ext-3.png'
          },
          {
            title: '4. Sweep Side to Side',
            desc: 'Sweep nozzle across base of fire until completely extinguished. Evacuate if uncontrolled.',
            img: 'images/ext-4.png'
          }
        ]
      },
      FIRE_CALL: {
        title: 'Fire Evacuation',
        category: 'Safety',
        type: 'alert',
        icon: 'local_fire_department',
        emergency: true,
        titleText: 'Evacuate & Call 911',
        desc: 'Leave building immediately. Do not use elevators. Call emergency dispatch from outside.',
        img: 'images/fire-alert.png'
      },
      POLICE: {
        title: 'Police Alert',
        category: 'Safety',
        type: 'alert',
        icon: 'local_police',
        emergency: false,
        titleText: 'Emergency SOS Sent',
        desc: 'Silent location beacon activated. Stay in a secure location. Dispatch notified.',
        img: 'images/police-alert.png'
      },
      CALM: {
        title: 'Paced Calm',
        category: 'Calm',
        type: 'calm'
      },
      CLOSING: {
        title: 'Standby',
        category: 'System',
        type: 'closing'
      }
    };

    const topBar = document.getElementById('top-bar');
    const viewport = document.getElementById('viewport');

    function updateTopBar(flow) {
      if (state.currentScreen === 'HOME') {
        topBar.innerHTML = `
          <div class="brand-anchor">
            <span class="brand-pulse-dot"></span>
            <h1 class="brand-title">Aid Pulse</h1>
          </div>
          <div class="header-right">
            <div class="status-pill">
              <span class="material-symbols-outlined status-pill-icon">mic</span>
              <span class="status-pill-text">Ready</span>
            </div>
          </div>
        `;
      } else {
        topBar.innerHTML = `
          <div class="breadcrumb-pill" id="back-btn" title="Back to Aid Pulse">
            <span class="material-symbols-outlined arrow-icon">arrow_back_ios_new</span>
            <span class="pill-text">Aid Pulse</span>
          </div>
          <div class="header-right">
            <div class="category-sensor-title">
              <span>${flow.category || flow.title}</span>
              <span class="category-sensor-dot"></span>
            </div>
          </div>
        `;
        const backBtn = document.getElementById('back-btn');
        if (backBtn) {
          backBtn.addEventListener('click', () => goBack());
        }
      }
    }

    function clearActiveTimers() {
      if (state.stepTimer) {
        clearTimeout(state.stepTimer);
        state.stepTimer = null;
      }
      if (state.calmInterval) {
        clearInterval(state.calmInterval);
        state.calmInterval = null;
      }
    }

    function renderScreen() {
      clearActiveTimers();

      const flow = FLOWS[state.currentScreen];
      if (!flow) return;

      updateTopBar(flow);
      viewport.innerHTML = '';

      if (flow.type === 'menu') {
        const wrap = document.createElement('div');
        wrap.className = 'menu-options';

        flow.items.forEach((item, index) => {
          const isSelected = index === state.selectedIndex;
          const el = document.createElement('div');
          el.className = `menu-item ${isSelected ? 'selected' : ''}`;
          el.id = `menu-item-${index}`;

          el.innerHTML = `
            <div class="menu-item-left">
              <div class="menu-icon-circle">
                <span class="material-symbols-outlined">${item.icon || 'arrow_forward'}</span>
              </div>
              <div class="menu-text-stack">
                <span class="menu-item-label">${item.label}</span>
                <span class="menu-item-sub">${item.sub}</span>
              </div>
            </div>
            <div class="menu-item-right">
              ${isSelected ? '<span class="menu-action-dot"></span>' : ''}
              <div class="menu-arrow-circle">
                <span class="material-symbols-outlined">arrow_forward</span>
              </div>
            </div>
          `;
          el.addEventListener('click', () => {
            state.selectedIndex = index;
            selectCurrent();
          });
          wrap.appendChild(el);
        });

        viewport.appendChild(wrap);
      } else if (flow.type === 'stepper') {
        const isLastStep = state.currentStep >= flow.steps.length - 1;

        // Auto advance after 5 seconds - loops back to 1st step after the last step
        state.stepTimer = setTimeout(() => {
          if (isLastStep) {
            state.currentStep = 0;
          } else {
            state.currentStep++;
          }
          renderScreen();
        }, 5000);

        const step = flow.steps[state.currentStep];
        const stepWrap = document.createElement('div');
        stepWrap.className = 'step-view';

        // Dots & 5s Timer Bar
        let dotsHtml = '<div class="stepper-dots">';
        for (let i = 0; i < flow.steps.length; i++) {
          dotsHtml += `<div class="dot ${i === state.currentStep ? 'active' : ''}"></div>`;
        }
        dotsHtml += '</div>';

        const progressHtml = `
          <div class="stepper-progress-wrap">
            ${dotsHtml}
            <div class="step-timer-bar">
              <div class="step-timer-fill"></div>
            </div>
          </div>
        `;

        // Image or Pacing
        let centerVisual = '';
        const imgTag = step.img ? `<img src="${step.img}" alt="${step.title}" class="step-image" onerror="this.style.display='none'">` : '';

        if (step.showPacer || (flow.hasPacer && state.currentStep === 4)) {
          centerVisual = `
            <div class="step-illustration-container">
              ${imgTag}
              <div class="cpr-pacer-ring overlay-badge">
                <div class="cpr-pacer-core overlay-badge-core"></div>
              </div>
            </div>
            <div class="bpm-tag">110 BPM PACER ACTIVE</div>
          `;
        } else if (step.img) {
          centerVisual = `
            <div class="step-illustration-container">
              ${imgTag}
            </div>
            ${flow.hasPacer ? '<div class="bpm-tag">110 BPM TARGET</div>' : ''}
          `;
        } else if (flow.hasPacer) {
          centerVisual = `
            <div class="step-illustration-container">
              <div class="cpr-pacer-ring"></div>
              <div class="cpr-pacer-core"></div>
            </div>
            <div class="bpm-tag">110 BPM RHYTHM</div>
          `;
        } else {
          centerVisual = `<div class="step-illustration-container"></div>`;
        }

        stepWrap.innerHTML = `
          <div>
            <div class="step-header">STEP ${state.currentStep + 1} OF ${flow.steps.length}</div>
            <div class="step-title">${step.title}</div>
            <div class="step-desc">${step.desc}</div>
          </div>
          ${centerVisual}
          ${progressHtml}
        `;

        viewport.appendChild(stepWrap);
      } else if (flow.type === 'calm') {
        const calmWrap = document.createElement('div');
        calmWrap.className = 'calm-container';

        calmWrap.innerHTML = `
          <div class="calm-shape-wrap">
            <div class="calm-circle-outer"></div>
            <div class="calm-circle"></div>
          </div>
          <div id="calm-text" class="calm-text">Breathe in...</div>
        `;

        viewport.appendChild(calmWrap);

        state.calmPhase = 'in';
        state.calmInterval = setInterval(() => {
          state.calmPhase = state.calmPhase === 'in' ? 'out' : 'in';
          const txt = document.getElementById('calm-text');
          if (txt) {
            txt.textContent = state.calmPhase === 'in' ? 'Breathe in...' : 'Breathe out...';
          }
        }, 4000);
      } else if (flow.type === 'alert') {
        const alertBox = document.createElement('div');
        alertBox.className = `alert-box ${flow.emergency ? 'emergency' : ''}`;
        
        const imgHtml = flow.img ? `
          <div class="step-illustration-container" style="height: 110px; margin: 0 auto 14px auto;">
            <img src="${flow.img}" alt="${flow.titleText}" class="step-image" onerror="this.style.display='none'">
          </div>
        ` : `
          <div class="alert-icon-wrap">
            <span class="material-symbols-outlined">${flow.icon || 'warning'}</span>
          </div>
        `;

        alertBox.innerHTML = `
          ${imgHtml}
          <div class="alert-title">${flow.titleText || 'Emergency Alert'}</div>
          <div class="alert-sub">${flow.desc || ''}</div>
        `;
        viewport.appendChild(alertBox);
      } else if (flow.type === 'closing') {
        viewport.innerHTML = `
          <div style="text-align: center;">
            <div style="font-size: 28px; font-weight: 600; color: var(--on-surface); margin-bottom: 8px;">False Alarm Cleared</div>
            <div style="font-size: 16px; font-weight: 500; color: var(--on-surface-variant);">Resetting HUD...</div>
          </div>
        `;
      }
    }

    function navigateMenu(direction) {
      const flow = FLOWS[state.currentScreen];
      if (flow.type === 'menu') {
        const count = flow.items.length;
        if (direction === 'next') {
          state.selectedIndex = (state.selectedIndex + 1) % count;
        } else if (direction === 'prev') {
          state.selectedIndex = (state.selectedIndex - 1 + count) % count;
        }
        renderScreen();
      } else if (flow.type === 'stepper') {
        if (direction === 'next' && state.currentStep < flow.steps.length - 1) {
          state.currentStep++;
          renderScreen();
        } else if (direction === 'prev' && state.currentStep > 0) {
          state.currentStep--;
          renderScreen();
        }
      }
    }

    // Hierarchy mapping for back navigation fallback
    const PARENT_SCREEN_MAP = {
      MEDICAL_MENU: 'HOME',
      SAFETY_MENU: 'HOME',
      CALM: 'HOME',
      CPR: 'MEDICAL_MENU',
      CHOKING: 'MEDICAL_MENU',
      DROWNING: 'MEDICAL_MENU',
      STROKE: 'MEDICAL_MENU',
      FIRE_MENU: 'SAFETY_MENU',
      FIRE_EXTINGUISHER: 'FIRE_MENU',
      FIRE_CALL: 'FIRE_MENU',
      POLICE: 'SAFETY_MENU',
      CLOSING: 'HOME'
    };

    function navigateToScreen(targetScreen, pushToHistory = true) {
      if (pushToHistory && state.currentScreen !== targetScreen) {
        state.history.push({
          screen: state.currentScreen,
          selectedIndex: state.selectedIndex,
          currentStep: state.currentStep
        });
        try {
          const newUrl = (targetScreen === 'HOME') ? window.location.pathname : ('#' + targetScreen);
          window.history.pushState({ screen: targetScreen }, '', newUrl);
        } catch (e) {}
      }
      state.currentScreen = targetScreen;
      state.selectedIndex = 0;
      state.currentStep = 0;
      renderScreen();
    }

    function selectCurrent() {
      const flow = FLOWS[state.currentScreen];
      if (flow.type === 'menu') {
        const selected = flow.items[state.selectedIndex];
        if (selected && selected.id) {
          navigateToScreen(selected.id, true);
        }
      }
    }

    function triggerFalseAlarm() {
      state.currentScreen = 'CLOSING';
      state.history = [];
      renderScreen();
      setTimeout(() => {
        state.currentScreen = 'HOME';
        state.selectedIndex = 0;
        state.currentStep = 0;
        state.history = [];
        try {
          window.history.replaceState({ screen: 'HOME' }, '', window.location.pathname);
        } catch (e) {}
        renderScreen();
      }, 1200);
    }

    function goBack() {
      if (state.currentScreen === 'CLOSING') return;

      if (state.currentScreen === 'HOME') {
        triggerFalseAlarm();
        return;
      }

      if (window.history.length > 1 && state.history && state.history.length > 0) {
        window.history.back();
      } else {
        const parentScreen = PARENT_SCREEN_MAP[state.currentScreen] || 'HOME';
        navigateToScreen(parentScreen, true);
      }
    }

    // Keyboard & Simulator Controller
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Backspace'].includes(e.key)) {
        e.preventDefault();
      }

      switch (e.key) {
        case 'ArrowRight':
        case 'ArrowDown':
          navigateMenu('next');
          break;
        case 'ArrowLeft':
        case 'ArrowUp':
          navigateMenu('prev');
          break;
        case 'Enter':
        case ' ':
          selectCurrent();
          break;
        case 'Backspace':
          goBack();
          break;
        case 'Escape':
          triggerFalseAlarm();
          break;
      }
    });

    // Touchpad Gesture Simulation: Touch Events on Viewport
    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 40) navigateMenu('next');
        else if (diffX < -40) goBack();
      } else {
        if (diffY > 40) navigateMenu('next');
        else if (diffY < -40) navigateMenu('prev');
      }
    }, { passive: true });

    // Handle Popstate Event
    window.addEventListener('popstate', (e) => {
      if (e.state && e.state.screen && FLOWS[e.state.screen]) {
        state.currentScreen = e.state.screen;
        if (state.history.length > 0) {
          const prev = state.history.pop();
          state.selectedIndex = prev ? prev.selectedIndex : 0;
          state.currentStep = prev ? prev.currentStep : 0;
        } else {
          state.selectedIndex = 0;
          state.currentStep = 0;
        }
        renderScreen();
      } else {
        const hash = window.location.hash.replace('#', '');
        if (hash && FLOWS[hash]) {
          state.currentScreen = hash;
          state.selectedIndex = 0;
          state.currentStep = 0;
          renderScreen();
        } else {
          state.currentScreen = 'HOME';
          state.selectedIndex = 0;
          state.currentStep = 0;
          renderScreen();
        }
      }
    });

    // Initial Screen Load
    window.addEventListener('load', () => {
      const initialHash = window.location.hash.replace('#', '');
      if (initialHash && FLOWS[initialHash]) {
        state.currentScreen = initialHash;
      } else {
        state.currentScreen = 'HOME';
      }
      renderScreen();
      const container = document.getElementById('hud-container');
      if (container) container.focus();
    });
  </script>
</body>
</html>
